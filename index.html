const KB='a i u e o ka ki ku ke ko sa shi su se so ta chi tsu te to na ni nu ne no ha hi fu he ho ma mi mu me mo ya yu yo ra ri ru re ro wa wo n'.split(' '),KK='あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん',KM={},SV={'ぁ':'a','ぃ':'i','ぅ':'u','ぇ':'e','ぉ':'o'},SY={'ゃ':'a','ゅ':'u','ょ':'o'};
[...KK].forEach((c,i)=>KM[c]=KB[i]);
[['がぎぐげご','ga gi gu ge go'],['ざじずぜぞ','za ji zu ze zo'],['だぢづでど','da ji zu de do'],['ばびぶべぼ','ba bi bu be bo'],['ぱぴぷぺぽ','pa pi pu pe po']].forEach(([c,r])=>{const R=r.split(' ');[...c].forEach((x,i)=>KM[x]=R[i])});
function toRoma(s){let o='',dbl=0;s=s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96));
for(const c of s){if(c==='っ'){dbl=1;continue}
if(c==='ー'){o+=o.slice(-1);continue}
if(SY[c]){const st=o.slice(0,-1);o=st+(/(sh|ch|j)$/.test(st)?'':'y')+SY[c];continue}
if(SV[c]){let st=o.slice(0,-1);if(st===''||/[aiueon]$/.test(st))st+='w';o=st+SV[c];continue}
let r=KM[c];if(r===undefined){o+=c;dbl=0;continue}
if(dbl){r=r[0]+r;dbl=0}o+=r}
return o}
function nz(s){s=toRoma(s.toLowerCase().replace(/[āâ]/g,'a').replace(/[īî]/g,'i').replace(/[ūû]/g,'u').replace(/[ēê]/g,'e').replace(/[ōô]/g,'o')).replace(/[^a-z]/g,'').replace(/tch|cch/g,'ch');
[['shi','si'],['chi','ti'],['tsu','tu'],['fu','hu'],['ji','zi'],['sha','sya'],['shu','syu'],['sho','syo'],['she','sye'],['cha','tya'],['chu','tyu'],['cho','tyo'],['che','tye'],['ja','zya'],['ju','zyu'],['jo','zyo'],['je','zye']].forEach(([a,b])=>s=s.split(a).join(b));
return s.replace(/([b-df-hj-np-tv-z])\1/g,'$1').replace(/aa/g,'a').replace(/ii/g,'i').replace(/uu/g,'u').replace(/ee/g,'e').replace(/oo|ou/g,'o').replace(/ei/g,'e')}
function lev(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);for(let j=0;j<=n;j++)d[0][j]=j;
for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1)}return d[m][n]}
function essay(w,my,p){return new Promise(res=>{let done=false,tried=0;
app.innerHTML=topbar(p)+TMR+`<div class="card"><div class="lb">Esai · tulis bacaannya (hiragana, katakana, atau romaji)</div>${w.j?`<div class="pr">${esc(w.j)}</div>`:`<div class="pr sm">${esc(w.a)}</div>`}</div><input id="in" lang="ja" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="ketik jawaban"><div id="fb"></div><button class="pri" id="ck" disabled>Periksa</button>`;
const inp=$('#in'),TM=mkT('es');setTimeout(()=>inp.focus(),50);
inp.oninput=()=>{$('#ck').disabled=!inp.value.trim()};
const chk=()=>{if(done||my!==SID||!inp.value.trim())return;
const r0=TM.stop();LAST.t=tried?4:r0.t;const A=nz(inp.value),T=nz(w.k),d=lev(A,T),ok=d===0||(d===1&&T.length>=4),fb=$('#fb');
if(!ok&&!tried){tried=1;fb.innerHTML='<p class="mu">Belum tepat. Cek ejaanmu lalu coba sekali lagi (1 kesempatan koreksi).</p>';inp.select();return}
done=true;inp.disabled=true;$('#ck').style.display='none';
if(d===0){fb.innerHTML='<div class="okt">✓ Benar</div>';setTimeout(()=>res(true),700)}
else if(ok){fb.innerHTML=`<div class="okt">✓ Diterima (salah ketik kecil)</div><div class="ans">Jawabanmu: ${esc(inp.value)}<br>Ejaan yang benar: ${esc(w.k)} (${esc(toRoma(w.k))})</div><button class="pri" id="nx">Lanjut</button>`;$('#nx').onclick=()=>res(true)}
else{fb.innerHTML=`<div class="not">✗ Salah</div><div class="ans">Jawabanmu: ${esc(inp.value)}<br>Yang benar: ${esc(w.k)} (${esc(toRoma(w.k))})</div><button class="pri" id="nx">Lanjut</button>`;$('#nx').onclick=()=>res(false)}};
$('#ck').onclick=chk;inp.onkeydown=e=>{if(e.key==='Enter')chk()};back()})}
async function exam(C,my,ess){const q=sh(C),E=ess?sh(C.filter(ESS)):[],T=q.length+E.length,miss=new Set();
for(let i=0;i<q.length;i++){const ok=await ask(q[i],'mc',my,i/T*100);if(my!==SID)return null;if(!ok)miss.add(q[i].id)}
if(E.length){await msg(`<div class="pr sm">Bagian esai</div><p class="mu">${E.length} kata. Ketik bacaan kata yang ditanyakan (hiragana, katakana, atau romaji). Salah ketik 1 huruf masih diterima, dan kamu punya 1 kesempatan koreksi per kata.</p>`,'Mulai esai',0,my);if(my!==SID)return null;
for(let i=0;i<E.length;i++){const ok=await essay(E[i],my,(q.length+i)/T*100);if(my!==SID)return null;ET[E[i].id]={ok,t:LAST.t};if(!ok)miss.add(E[i].id)}}
return miss}
const msg=(html,btn,fn,my)=>new Promise(res=>{if(my!==SID)return;app.innerHTML=`<div class="card">${html}</div><button class="pri" id="ok">${btn}</button><button class="ghost" id="bk">‹ Menu</button>`;$('#ok').onclick=()=>res(fn&&fn());back()});
async function fix(X,my,ess){const need=new Map(X.map(w=>[w.id,0])),q=sh(X),tot=X.length*2,prog=()=>[...need.values()].reduce((a,b)=>a+b,0)/tot*100,back2=()=>Math.min(q.length,2+(Math.random()*3|0));
while(q.length){if(my!==SID)return null;const w=q.shift(),s0=need.get(w.id);
const ok=(ess&&ESS(w)&&s0===1)?await essay(w,my,prog()):await ask(w,'mc',my,prog());if(my!==SID)return null;
if(ok){need.set(w.id,s0+1);if(s0+1<2)q.splice(back2(),0,w)}else{need.set(w.id,0);q.splice(back2(),0,w)}}
return 1}
async function gate(C,title,hd,my,bad,ess){const ne=ess?C.filter(ESS).length:0;
await msg(`<div class="lb">${hd}</div><div class="pr sm">${title}</div><p class="mu">${C.length} soal mencocokkan${ne?` + ${ne} soal esai (ketik bacaan kata satu-kata)`:''}. Kata yang salah tidak membuatmu mengulang semuanya: kamu hanya perlu putaran perbaikan sampai tiap kata benar 2× berturut-turut.</p>`,'Mulai ujian',0,my);if(my!==SID)return 0;

m.forEach(x=>bad.add(x));const X=C.filter(w=>m.has(w.id));
await msg(`<div class="not">✗ ${m.size} kata salah</div><p class="mu">Belum selesai, tapi tidak perlu mengulang seluruh ujian. Pelajari kata yang salah, lalu kerjakan putaran perbaikan.</p><div class="ans" style="text-align:left">${X.map(w=>`${esc(w.k)}${w.j?' / '+esc(w.j):''} — ${esc(w.s)}`).join('<br>')}</div>`,'Pelajari lagi',0,my);if(my!==SID)return 0;
await study(X,hd+' · perbaikan',my);if(my!==SID)return 0;
await msg(`<div class="pr sm">Putaran perbaikan</div><p class="mu">${X.length} kata. Tiap kata harus benar 2× berturut-turut. Jawaban salah mengulang hitungan kata itu${ess&&X.some(ESS)?'. Kata esai diuji dengan pencocokan dulu, lalu esai':''}.</p>`,'Mulai',0,my);if(my!==SID)return 0;
const r=await fix(X,my,ess);if(r===null)return 0;return 1}
async function play(n){const my=++SID,W=D.filter(w=>w.b===n),N=Math.ceil(W.length/10),bad=new Set();
if(await revSess(my,1)===null)return;
for(let c=S.st[n]?0:Math.min(S.sp[n]||0,N);c<N;c++){const C=W.slice(c*10,c*10+10),hd=`Bab ${n} · Set ${c+1}/${N}`;
await msg(`<div class="lb">${hd}</div><div class="pr sm">Menghafal</div><p class="mu">${C.length} kata. Lihat sisi depan (kanji atau kana), coba ingat bacaan dan artinya, lalu ketuk kartu untuk membalik. Setelah selesai, langsung ujian.</p>`,'Mulai',0,my);if(my!==SID)return;

const stars=bad.size===0?3:bad.size<=W.length*.15?2:1;S.u=Math.max(S.u,Math.min(n+1,25));S.st[n]=Math.max(S.st[n]||0,stars);save();

async function revSess(my,auto){const now=Date.now();
const all=D.filter(w=>ESS(w)&&S.bx[w.id]&&S.bx[w.id].d<=now).sort((a,b)=>{const A=S.bx[a.id],B=S.bx[b.id];return A.l-B.l||A.d-B.d||Math.random()-.5});

if(ok)done.add(w.id);else q.splice(Math.min(q.length,2+(Math.random()*3|0)),0,w)}

async function review(){const my=++SID,r=await revSess(my,0);if(r===null)return;if(r.rem)review();else home()}
